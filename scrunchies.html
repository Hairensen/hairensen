<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hairensen – Scrunchies</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f7f1eb; /* Light beige background */
      color: #3d2c2c; /* Dark brown text */
    }

    header {
      background-color: #e6d3c5; /* Beige header */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .logo-container {
      display: flex;
      align-items: center;
      margin: 0 10px; /* Space between logos and title */
    }

    .logo-container img {
      height: 60px;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    nav {
      text-align: center;
      margin-top: 1rem;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #3d2c2c;
      font-weight: 600;
    }

    .product-section {
      margin-top: 2rem;
      padding: 1.5rem;
      text-align: center;
    }

    .scrunchie-product {
      display: inline-block;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin: 1rem;
      text-align: center;
      width: 200px;
      transition: transform 0.3s ease;
    }

    .scrunchie-product:hover {
      transform: scale(1.05); /* When you hover the mouse, the product becomes a bit larger and it's very nice hihihihihihi */
    }

    .scrunchie-product img {
      width: 100%;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #e6d3c5; /* Beige footer */
    }
  </style>
</head>
<body>

  <header>
    <!-- Logos positioned beside the title -->
    <div class="logo-container">
      <a href="index.html">
        <img src="logo.png" alt="Hairensen logo">
      </a>
    </div>
    <h1>Hairensen</h1>
    <div class="logo-container">
      <a href="index.html">
        <img src="logo.png" alt="Hairensen logo">
      </a>
    </div>
  </header>

  <!-- Navigation links below the title -->
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="product-section">
    <h2>Our Scrunchies</h2>

    <!-- Scrunchie 1: Emilie -->
    <div class="scrunchie-product">
      <img src="https://i.imgur.com/4XhZ7XZ.jpg" alt="Weird scrunchie">
      <h3>Emilie</h3>
      <p>49 kr</p>
      <a href="Emilie.html"><button>See more</button></a>
    </div>

    <!-- Scrunchie 2: Anna -->
    <div class="scrunchie-product">
      <img src="https://i.imgur.com/4XhZ7XZ.jpg" alt="Strange scrunchie">
      <h3>Anna</h3>
      <p>49 kr</p>
      <a href="Anna.html"><button>See more</button></a>
    </div>

  </div>

  <footer>
    &copy; 2025 Hairensen – All rights reserved
  </footer>

</body>
</html>
