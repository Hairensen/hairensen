<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Hairensen – Scrunchies</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f7f1eb; /* Lys beige baggrund */
      color: #3d2c2c; /* Mørk brun tekst */
    }

    header {
      background-color: #e6d3c5; /* Beige header */
      text-align: center;
      padding: 1.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #3d2c2c;
      font-weight: 600;
    }

    .product-section {
      margin-top: 2rem;
      padding: 1.5rem;
      text-align: center;
    }

    .scrunchie-product {
      display: inline-block;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin: 1rem;
      text-align: center;
      width: 200px;
      transition: transform 0.3s ease;
    }

    .scrunchie-product:hover {
      transform: scale(1.05); /* Når man holder musen over bliver produktet lidt større og det er meget godt hihihihihihi*/
    }

    .scrunchie-product img {
      width: 100%;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #e6d3c5; /* Beige footer */
    }
  </style>
</head>
