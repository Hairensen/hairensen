<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hairensen – Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f7f1eb; /* Light beige background */
      color: #3d2c2c; /* Dark brown text */
    }

    header {
      background-color: #e6d3c5; /* Beige header */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      flex-wrap: wrap; /* Allow wrapping of logos and title */
    }

    .logo-container {
      display: flex;
      align-items: center;
      margin: 0 10px; /* Space between logos and title */
    }

    .logo-container img {
      height: 60px;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    nav {
      display: flex;
      justify-content: center; /* Center the nav links */
      margin-top: 1rem;
      width: 100%;
      justify-content: center;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #3d2c2c;
      font-weight: 600;
    }

    .product-section {
      margin-top: 2rem;
      padding: 1.5rem;
      text-align: center;
    }

    .categories button {
      background-color: #6f4f32; /* Dark brown button */
      color: white;
      padding: 10px 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      margin: 10px;
      cursor: pointer;
    }

    .categories button:hover {
      background-color: #4f3a26; /* Slightly darker on hover */
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #e6d3c5; /* Beige footer */
    }
  </style>
</head>
<body>

<header>
  <!-- Logos positioned beside the title -->
  <div class="logo-container">
    <a href="index.html">
      <img src="logo.png" alt="Hairensen logo">
    </a>
  </div>
  <h1>Hairensen</h1>
  <div class="logo-container">
    <a href="index.html">
      <img src="logo.png" alt="Hairensen logo">
    </a>
  </div>
</header>

<!-- Navigation links below the title -->
<nav>
  <a href="index.html">Home</a>
  <a href="products.html">Products</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="product-section">
  <h2>Our Products</h2>
  <p>Select a category to view our products:</p>
  
  <div class="categories">
    <!-- Categories as buttons -->
    <a href="scrunchies.html"><button>Scrunchies</button></a>
    <!-- More categories can be added here later -->
  </div>
</div>

<footer>
  &copy; 2025 Hairensen – All rights reserved
</footer>

</body>
</html>
